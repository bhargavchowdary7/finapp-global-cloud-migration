name: Storage-Migration-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none

pool:
  name: 'ch-sha-linux'

variables:
  - group: 'migration-secrets'
  - name: environment
    value: 'Production'
  - name: subscriptionConnection
    value: 'name of the service connection'


parameters:
  - name: migrationScope
    displayName: 'Migration Scope'
    type: string
    default: 'all-volumes'
    values:
      - all-volumes
      - by-business-unit
      - by-size
      - custom-selection

  - name: businessUnit
    displayName: 'Business Unit'
    type: string
    default: 'all'
    values:
      - all
      - finance
      - trading
      - compliance
    condition: eq('${{ parameters.migrationScope }}', 'by-business-unit')

  - name: selectedVolumeIds
    displayName: 'Volume IDs (comma-separated)'
    type: string
    default: ''
    condition: eq('${{ parameters.migrationScope }}', 'custom-selection')

  - name: maxParallelVolumes
    displayName: 'Max Parallel Volumes'
    type: number
    default: 2
    minValue: 1
    maxValue: 5

  - name: useDataBoxForLarge
    displayName: 'Use Data Box for Large Volumes'
    type: boolean
    default: true

stages:
  - stage: Volume_Selection
    displayName: 'Volume Selection'
    jobs:
      - job: Select_Volumes
        displayName: 'Select Volumes for Migration'
        steps:
          - checkout: self
          
          - task: PowerShell@2
            displayName: 'Load Volume Configurations'
            inputs:
              targetType: 'inline'
              script: |
                $volumeConfigs = .\storage-migration\Scripts\Get-VolumeConfigurations.ps1 -Source "File"
                Write-Host "Loaded $($volumeConfigs.Count) volume configurations"

          - task: PowerShell@2
            displayName: 'Apply Volume Filters'
            inputs:
              targetType: 'inline'
              script: |
                $volumeConfigs = .\storage-migration\Scripts\Get-VolumeConfigurations.ps1 -Source "File"
                $selectedVolumes = .\storage-migration\Scripts\Apply-VolumeFilters.ps1 `
                  -Volumes $volumeConfigs `
                  -MigrationScope "${{ parameters.migrationScope }}" `
                  -BusinessUnit "${{ parameters.businessUnit }}" `
                  -SelectedVolumeIds "${{ parameters.selectedVolumeIds }}"
                
                Write-Host "Selected $($selectedVolumes.Count) volumes for migration"
                $selectedVolumes | ConvertTo-Json -Depth 5 | Out-File "$(Pipeline.Workspace)/selected-volumes.json"

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Volume Selection'
            inputs:
              targetPath: '$(Pipeline.Workspace)/selected-volumes.json'
              artifact: 'volume-selection'
              publishLocation: 'pipeline'

  - stage: Storage_Migration
    displayName: 'Storage Migration'
    dependsOn: Volume_Selection
    jobs:
      - deployment: Migrate_Volumes
        displayName: 'Migrate Selected Volumes'
        environment: Production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: volume-selection
                  displayName: 'Download Volume Selection'

                - task: AzurePowerShell@5
                  displayName: 'Execute Volume Migration'
                  inputs:
                    azureSubscription: ${{ variables.subscriptionConnection }}
                    ScriptType: 'FilePath'
                    ScriptPath: 'storage-migration/Storage-Migration-ByVolume.ps1'
                    ScriptArguments: >
                      -KeyVaultName "$(KEY_VAULT_NAME)"
                      -ResourceGroupName "$(RESOURCE_GROUP)"
                      -StorageAccountName "$(STORAGE_ACCOUNT_NAME)"
                      -Region "$(PRIMARY_REGION)"
                      -VolumeConfigurations (Get-Content '$(Pipeline.Workspace)/volume-selection/selected-volumes.json' | ConvertFrom-Json)
                      -MaxParallelVolumes ${{ parameters.maxParallelVolumes }}
                      -UseDataBoxForLargeVolumes:$${{ parameters.useDataBoxForLarge }}
                    azurePowerShellVersion: 'LatestVersion'

  - stage: Migration_Reports
    displayName: 'Migration Reports'
    dependsOn: Storage_Migration
    jobs:
      - job: Generate_Reports
        displayName: 'Generate Migration Reports'
        steps:
          - task: PowerShell@2
            displayName: 'Create Migration Dashboard'
            inputs:
              targetType: 'inline'
              script: |
                .\storage-migration\Scripts\New-MigrationDashboard.ps1 -OutputPath "$(Build.ArtifactStagingDirectory)/migration-dashboard.html"

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Migration Reports'
            inputs:
              pathtoPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: 'storage-migration-reports'

  - stage: Notify
    displayName: 'Notification'
    dependsOn: Migration_Reports
    condition: always()
    jobs:
      - job: Send_Notification
        displayName: 'Send Migration Status'
        steps:
          - task: PowerShell@2
            displayName: 'Migration Status Summary'
            inputs:
              targetType: 'inline'
              script: |
                if ('$(Agent.JobStatus)' -eq 'Succeeded') {
                  Write-Host " Storage Migration Completed Successfully" -ForegroundColor Green
                  Write-Host " Check artifacts for migration reports" -ForegroundColor White
                } else {
                  Write-Host " Storage Migration Failed" -ForegroundColor Red
                }