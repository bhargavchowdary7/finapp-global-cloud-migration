# PowerShell Steps Template for Azure DevOps Pipelines
# Provides reusable PowerShell steps for database and storage migration

parameters:
- name: 'scriptType'
  type: string
  default: 'database'
  values:
  - 'database'
  - 'storage'
  - 'validation'
  
- name: 'environment'
  type: string
  default: 'dev'
  
- name: 'keyVaultName'
  type: string
  default: ''
  
- name: 'additionalParameters'
  type: object
  default: []

- name: 'continueOnError'
  type: boolean
  default: false

- name: 'timeoutInMinutes'
  type: number
  default: 30

steps:
# Install required PowerShell modules
- powershell: |
    Write-Host "Installing required PowerShell modules..."
    $requiredModules = @(
      "Az",
      "Az.KeyVault",
      "Az.Storage",
      "SqlServer",
      "PSScriptAnalyzer"
    )
    
    foreach ($module in $requiredModules) {
      try {
        if (!(Get-Module -ListAvailable -Name $module)) {
          Write-Host "Installing module: $module"
          Install-Module -Name $module -Force -AllowClobber -Scope CurrentUser -ErrorAction Stop
        }
        Import-Module $module -Force -ErrorAction Stop
        Write-Host "✓ $module module loaded successfully" -ForegroundColor Green
      }
      catch {
        Write-Host "✗ Failed to install/load module: $module" -ForegroundColor Red
        Write-Host "Error: $($_.Exception.Message)" -ForegroundColor Red
      }
    }
    
    Write-Host "PowerShell module installation completed" -ForegroundColor Green
  displayName: 'Install PowerShell Modules'
  enabled: true

# Get secrets from Key Vault
- task: AzureKeyVault@2
  inputs:
    azureSubscription: '$(AzureSubscription)'
    KeyVaultName: '${{ parameters.keyVaultName }}'
    SecretsFilter: '*'
    RunAsPreJob: true
  displayName: 'Get Secrets from Key Vault'
  condition: and(succeeded(), ne('${{ parameters.keyVaultName }}', ''))

# Database Migration Steps
- ${{ if eq(parameters.scriptType, 'database') }}:
  - powershell: |
      Write-Host "Starting Database Migration for ${{ parameters.environment }} environment"
      Write-Host "=========================================="
      
      # Set environment-specific variables
      $SourceServer = "$(DatabaseSourceServer)"
      $TargetServer = "$(DatabaseTargetServer)"
      $DatabaseName = "$(DatabaseName)"
      $KeyVaultName = "${{ parameters.keyVaultName }}"
      
      Write-Host "Source Server: $SourceServer"
      Write-Host "Target Server: $TargetServer"
      Write-Host "Database: $DatabaseName"
      Write-Host "Key Vault: $KeyVaultName"
      
      # Test database connectivity
      Write-Host "`nTesting database connectivity..."
      .\database-migration\Test-KeyVaultSecrets.ps1 -KeyVaultName $KeyVaultName -SecretNames @(
        "$SourceServer-$DatabaseName-connectionstring",
        "$TargetServer-$DatabaseName-connectionstring"
      )
      
    displayName: 'Initialize Database Migration'
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}

  - powershell: |
      Write-Host "Starting Database Assessment..."
      $AssessmentParams = @{
        SourceServer = "$(DatabaseSourceServer)"
        DatabaseName = "$(DatabaseName)"
        OutputPath = "$(Pipeline.Workspace)/Assessment"
      }
      .\database-migration\Invoke-DatabaseAssessment.ps1 @AssessmentParams
    displayName: 'Run Database Assessment'
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    continueOnError: ${{ parameters.continueOnError }}

  - powershell: |
      Write-Host "Starting Schema Migration..."
      $SchemaParams = @{
        SourceServer = "$(DatabaseSourceServer)"
        TargetServer = "$(DatabaseTargetServer)"
        DatabaseName = "$(DatabaseName)"
        ExportPath = "$(Pipeline.Workspace)/SchemaExport"
      }
      .\database-migration\Invoke-SchemaMigration.ps1 @SchemaParams
    displayName: 'Run Schema Migration'
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    continueOnError: ${{ parameters.continueOnError }}

  - powershell: |
      Write-Host "Starting Data Validation..."
      $ValidationParams = @{
        SourceServer = "$(DatabaseSourceServer)"
        TargetServer = "$(DatabaseTargetServer)"
        DatabaseName = "$(DatabaseName)"
        SampleSize = 1000
      }
      .\database-migration\Invoke-DataValidation.ps1 @ValidationParams
    displayName: 'Run Data Validation'
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    continueOnError: ${{ parameters.continueOnError }}

  - powershell: |
      Write-Host "Generating Migration Report..."
      $ReportPath = "$(Pipeline.Workspace)/Reports"
      if (!(Test-Path $ReportPath)) {
        New-Item -ItemType Directory -Path $ReportPath -Force
      }
      
      # Collect assessment, schema, and validation results
      $AssessmentFile = Get-ChildItem -Path "$(Pipeline.Workspace)/Assessment" -Filter "*Assessment*.json" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
      $ValidationFile = Get-ChildItem -Path "." -Filter "*Validation*.json" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
      
      if ($AssessmentFile -and $ValidationFile) {
        $AssessmentData = Get-Content $AssessmentFile.FullName | ConvertFrom-Json
        $ValidationData = Get-Content $ValidationFile.FullName | ConvertFrom-Json
        
        $ReportData = @{
          Assessment = $AssessmentData
          Validation = $ValidationData
          MigrationDate = Get-Date
          Environment = "${{ parameters.environment }}"
        }
        
        $ReportData | ConvertTo-Json -Depth 5 | Out-File -FilePath "$ReportPath/database-migration-report.json"
        Write-Host "Database migration report generated: $ReportPath/database-migration-report.json" -ForegroundColor Green
      }
    displayName: 'Generate Database Migration Report'
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}

# Storage Migration Steps
- ${{ if eq(parameters.scriptType, 'storage') }}:
  - powershell: |
      Write-Host "Starting Storage Migration for ${{ parameters.environment }} environment"
      Write-Host "=========================================="
      
      $SourcePath = "$(StorageSourcePath)"
      $TargetPath = "$(StorageTargetPath)"
      $MigrationType = "$(StorageMigrationType)"
      
      Write-Host "Source Path: $SourcePath"
      Write-Host "Target Path: $TargetPath"
      Write-Host "Migration Type: $MigrationType"
      
      # Test source accessibility
      Write-Host "`nTesting source storage accessibility..."
      .\storage-migration\Scripts\Test-VolumeAccessibility.ps1 -SourcePath $SourcePath -TestTypes @("Read", "List")
      
    displayName: 'Initialize Storage Migration'
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}

  - powershell: |
      Write-Host "Running Storage Assessment..."
      $AssessmentParams = @{
        SourcePath = "$(StorageSourcePath)"
        OutputPath = "$(Pipeline.Workspace)/StorageAssessment"
      }
      .\storage-migration\Scripts\Get-VolumeConfigurations.ps1 @AssessmentParams
    displayName: 'Run Storage Assessment'
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    continueOnError: ${{ parameters.continueOnError }}

  - powershell: |
      Write-Host "Creating Migration Plan..."
      $Volumes = Get-Content "$(Pipeline.Workspace)/StorageAssessment/volume-config-*.json" | ConvertFrom-Json
      
      $PlanParams = @{
        SourcePath = "$(StorageSourcePath)"
        TargetPath = "$(StorageTargetPath)"
        Volumes = @($Volumes)
        MigrationType = "$(StorageMigrationType)"
        OutputPath = "$(Pipeline.Workspace)/MigrationPlan"
      }
      .\storage-migration\Scripts\New-MigrationPlan.ps1 @PlanParams
    displayName: 'Create Migration Plan'
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    continueOnError: ${{ parameters.continueOnError }}

  - powershell: |
      Write-Host "Executing Storage Migration..."
      $MigrationPlan = Get-Content "$(Pipeline.Workspace)/MigrationPlan/migration-plan-*.json" | ConvertFrom-Json
      
      $MigrationParams = @{
        SourcePath = "$(StorageSourcePath)"
        TargetPath = "$(StorageTargetPath)"
        MigrationType = "$(StorageMigrationType)"
        ConfigPath = "$(Pipeline.Workspace)/Config"
        LogPath = "$(Pipeline.Workspace)/MigrationLogs"
      }
      .\storage-migration\Start-SecureStorageMigration.ps1 @MigrationParams
    displayName: 'Execute Storage Migration'
    timeoutInMinutes: 120  # Longer timeout for actual migration
    continueOnError: ${{ parameters.continueOnError }}

  - powershell: |
      Write-Host "Validating Storage Migration..."
      $ValidationParams = @{
        SourcePath = "$(StorageSourcePath)"
        TargetPath = "$(StorageTargetPath)"
        ExecutionResults = @{}  # Would be populated from previous steps
        ValidationDepth = "Standard"
      }
      .\storage-migration\Scripts\Invoke-StorageValidation.ps1 @ValidationParams
    displayName: 'Validate Storage Migration'
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    continueOnError: ${{ parameters.continueOnError }}

# Validation Steps
- ${{ if eq(parameters.scriptType, 'validation') }}:
  - powershell: |
      Write-Host "Running Comprehensive Validation for ${{ parameters.environment }} environment"
      Write-Host "=========================================="
      
      # Database validation
      if ("$(ValidateDatabase)" -eq "true") {
        Write-Host "Validating database migration..."
        $DbValidationParams = @{
          SourceServer = "$(DatabaseSourceServer)"
          TargetServer = "$(DatabaseTargetServer)"
          DatabaseName = "$(DatabaseName)"
          SampleSize = 500
        }
        .\database-migration\Invoke-DataValidation.ps1 @DbValidationParams
      }
      
      # Storage validation
      if ("$(ValidateStorage)" -eq "true") {
        Write-Host "Validating storage migration..."
        $StorageValidationParams = @{
          SourcePath = "$(StorageSourcePath)"
          TargetPath = "$(StorageTargetPath)"
          ValidationDepth = "Comprehensive"
        }
        .\storage-migration\Scripts\Invoke-StorageValidation.ps1 @StorageValidationParams
      }
    displayName: 'Run Comprehensive Validation'
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    continueOnError: ${{ parameters.continueOnError }}

  - powershell: |
      Write-Host "Generating Validation Report..."
      $ReportPath = "$(Pipeline.Workspace)/ValidationReports"
      if (!(Test-Path $ReportPath)) {
        New-Item -ItemType Directory -Path $ReportPath -Force
      }
      
      # Collect all validation results
      $ValidationResults = @()
      
      # Database validation results
      $DbValidationFiles = Get-ChildItem -Path "." -Filter "*Validation*.json" | Where-Object { $_.Name -like "*Database*" -or $_.Name -like "*DataValidation*" }
      foreach ($file in $DbValidationFiles) {
        $data = Get-Content $file.FullName | ConvertFrom-Json
        $ValidationResults += @{
          Type = "Database"
          File = $file.Name
          Data = $data
        }
      }
      
      # Storage validation results
      $StorageValidationFiles = Get-ChildItem -Path "." -Filter "*Validation*.json" | Where-Object { $_.Name -like "*Storage*" }
      foreach ($file in $StorageValidationFiles) {
        $data = Get-Content $file.FullName | ConvertFrom-Json
        $ValidationResults += @{
          Type = "Storage"
          File = $file.Name
          Data = $data
        }
      }
      
      $ValidationReport = @{
        ValidationDate = Get-Date
        Environment = "${{ parameters.environment }}"
        Results = $ValidationResults
        Summary = @{
          TotalValidations = $ValidationResults.Count
          PassedValidations = ($ValidationResults | Where-Object { $_.Data.OverallStatus -eq "Pass" }).Count
          FailedValidations = ($ValidationResults | Where-Object { $_.Data.OverallStatus -ne "Pass" }).Count
        }
      }
      
      $ValidationReport | ConvertTo-Json -Depth 5 | Out-File -FilePath "$ReportPath/validation-report.json"
      Write-Host "Validation report generated: $ReportPath/validation-report.json" -ForegroundColor Green
    displayName: 'Generate Validation Report'
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}

# Publish test results and reports
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Pipeline.Workspace)/Reports'
    ArtifactName: 'MigrationReports'
    publishLocation: 'Container'
  displayName: 'Publish Migration Reports'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Pipeline.Workspace)/ValidationReports'
    ArtifactName: 'ValidationReports'
    publishLocation: 'Container'
  displayName: 'Publish Validation Reports'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Pipeline.Workspace)/MigrationLogs'
    ArtifactName: 'MigrationLogs'
    publishLocation: 'Container'
  displayName: 'Publish Migration Logs'
  condition: succeededOrFailed()