name: Database-Migration-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none

pool:
  name: 'ch-sha-linux'

variables:
  - group: 'migration-secrets'
  - name: environment
    value: 'Production'
  - name: subscriptionConnection
    value: 'name of the service connection'


parameters:
  - name: runPreMigration
    displayName: 'Run Pre-Migration Validation'
    type: boolean
    default: true
    
  - name: runDataMigration
    displayName: 'Run Data Migration'
    type: boolean
    default: false
    
  - name: runPostMigration
    displayName: 'Run Post-Migration Validation'
    type: boolean
    default: true
    
  - name: batchSizeGB
    displayName: 'Batch Size (GB)'
    type: number
    default: 500
    minValue: 100
    maxValue: 1000

stages:
  - stage: Pre_Migration
    displayName: 'Pre-Migration'
    condition: eq('${{ parameters.runPreMigration }}', 'true')
    jobs:
      - job: Validate_Environment
        displayName: 'Validate Migration Environment'
        steps:
          - checkout: self
          
          - task: AzurePowerShell@5
            displayName: 'Validate Source Database'
            inputs:
              azureSubscription: ${{ variables.subscriptionConnection }}
              ScriptType: 'FilePath'
              ScriptPath: 'database-migration/Scripts/Invoke-DatabaseAssessment.ps1'
              ScriptArguments: >
                -KeyVaultName "$(KEY_VAULT_NAME)"
                -ResourceGroupName "$(RESOURCE_GROUP)"
              azurePowerShellVersion: 'LatestVersion'

  - stage: Data_Migration
    displayName: 'Data Migration'
    dependsOn: Pre_Migration
    condition: and(succeeded(), eq('${{ parameters.runDataMigration }}', 'true'))
    jobs:
      - deployment: Migrate_Database
        displayName: 'Migrate 50TB Database'
        environment: Production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                
                - task: AzurePowerShell@5
                  displayName: 'Execute Database Migration'
                  inputs:
                    azureSubscription: ${{ variables.subscriptionConnection }}
                    ScriptType: 'FilePath'
                    ScriptPath: 'database-migration/Database-Migration-WithKeyVault.ps1'
                    ScriptArguments: >
                      -KeyVaultName "$(KEY_VAULT_NAME)"
                      -ResourceGroupName "$(RESOURCE_GROUP)"
                      -Region "$(PRIMARY_REGION)"
                      -BatchSizeGB ${{ parameters.batchSizeGB }}
                    azurePowerShellVersion: 'LatestVersion'

  - stage: Post_Migration
    displayName: 'Post-Migration'
    dependsOn: Data_Migration
    condition: and(succeeded(), eq('${{ parameters.runPostMigration }}', 'true'))
    jobs:
      - job: Validate_Migration
        displayName: 'Validate Migration Results'
        steps:
          - task: AzurePowerShell@5
            displayName: 'Validate Data Integrity'
            inputs:
              azureSubscription: ${{ variables.subscriptionConnection }}
              ScriptType: 'FilePath'
              ScriptPath: 'database-migration/Scripts/Invoke-DataValidation.ps1'
              ScriptArguments: >
                -KeyVaultName "$(KEY_VAULT_NAME)"
              azurePowerShellVersion: 'LatestVersion'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Migration Report'
            inputs:
              pathtoPublish: '$(System.DefaultWorkingDirectory)/migration-reports'
              artifactName: 'database-migration-report'

  - stage: Notify
    displayName: 'Notification'
    dependsOn: 
      - Pre_Migration
      - Data_Migration
      - Post_Migration
    condition: always()
    jobs:
      - job: Send_Notification
        displayName: 'Send Migration Status'
        steps:
          - task: PowerShell@2
            displayName: 'Migration Status Summary'
            inputs:
              targetType: 'inline'
              script: |
                if ('$(Agent.JobStatus)' -eq 'Succeeded') {
                  Write-Host " Database Migration Completed Successfully" -ForegroundColor Green
                } else {
                  Write-Host " Database Migration Failed" -ForegroundColor Red
                }